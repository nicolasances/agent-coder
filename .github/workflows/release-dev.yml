name: Build and Deploy to GKE

on:
  push:
    branches:
      - 'feature/**'
      - main
  workflow_dispatch:

env:
  PROJECT_ID: totoexperiments
  REGION:  europe-west1
  PACKAGE_NAME: 'agent-coder'
  PACKAGE_VERSION: '0.1.2'
  # The KEDA ScaledJob (and its CPU/memory sizing) is defined in toto-terra-gke.
  # This workflow only swaps the image it runs.
  GKE_NAMESPACE: agents-dev
  SCALEDJOB_NAME: agent-coder

# Two deploys to the same ScaledJob must not race
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to GKE
    runs-on: ubuntu-latest
    environment: totoexperiments
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.CICD_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{env.PACKAGE_NAME}}/${{ env.PACKAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{env.PACKAGE_NAME}}/${{ env.PACKAGE_NAME }}:${{ github.sha }} \
                     ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{env.PACKAGE_NAME}}/${{ env.PACKAGE_NAME }}:latest

      - name: Push Docker image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{env.PACKAGE_NAME}}/${{ env.PACKAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{env.PACKAGE_NAME}}/${{ env.PACKAGE_NAME }}:latest

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          project_id: ${{ vars.GKE_PROJECT_ID }}
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: ${{ vars.GKE_CLUSTER_LOCATION }}

      # `kubectl set image` does not work on KEDA custom resources, so patch the
      # ScaledJob's pod template directly. Container 0 is the agent-coder container.
      - name: Deploy to GKE (patch ScaledJob image)
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{env.PACKAGE_NAME}}/${{ env.PACKAGE_NAME }}:${{ github.sha }}
          kubectl -n ${{ env.GKE_NAMESPACE }} patch scaledjob ${{ env.SCALEDJOB_NAME }} --type=json \
            -p "[{\"op\":\"replace\",\"path\":\"/spec/jobTargetRef/template/spec/containers/0/image\",\"value\":\"$IMAGE\"}]"

      - name: Deployment successful
        run: |
          echo "✅ ScaledJob image updated!"
          echo "ScaledJob: ${{ env.SCALEDJOB_NAME }} (namespace ${{ env.GKE_NAMESPACE }})"
          echo "Image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{env.PACKAGE_NAME}}/${{ env.PACKAGE_NAME }}:${{ github.sha }}"
