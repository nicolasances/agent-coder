name: Build and Deploy to Cloud Run Job

on:
  push:
    branches:
      - 'feature/**'
      - main
  workflow_dispatch:

env:
  PROJECT_ID: totoexperiments
  REGION:  europe-west1
  PACKAGE_NAME: 'agent-coder'
  PACKAGE_VERSION: '0.1.0'
  # Sized for the largest repo we run against, not the average one: Cloud Run's
  # container filesystem is in-memory, so the /workspace clone counts against
  # this number on top of the agent CLI's own footprint. 2Gi is a step up from
  # the 512Mi default that OOMed, not a measured figure — if a big repo still
  # OOMs, this is the first knob, and per docs/concept.md §3.2 the vCPU-minutes
  # are noise next to the tokens a run spends. Note that Cloud Run pairs memory
  # with CPU: past 4Gi it requires more than 1 CPU, so raise both together.
  JOB_MEMORY: '2Gi'
  JOB_CPU: '1'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: totoexperiments
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.CICD_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{env.PACKAGE_NAME}}/${{ env.PACKAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{env.PACKAGE_NAME}}/${{ env.PACKAGE_NAME }}:${{ github.sha }} \
                     ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{env.PACKAGE_NAME}}/${{ env.PACKAGE_NAME }}:latest

      - name: Push Docker image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{env.PACKAGE_NAME}}/${{ env.PACKAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{env.PACKAGE_NAME}}/${{ env.PACKAGE_NAME }}:latest

      - name: Deploy to Cloud Run Job
        run: |
          gcloud run jobs deploy ${{ env.PACKAGE_NAME }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{env.PACKAGE_NAME}}/${{ env.PACKAGE_NAME }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --max-retries=0 \
            --task-timeout=1800s \
            --memory=${{ env.JOB_MEMORY }} \
            --cpu=${{ env.JOB_CPU }} \
            --set-env-vars=GCP_PID=${{ env.PROJECT_ID }} \
            --service-account=${{ env.PACKAGE_NAME}}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: Job deployment successful
        run: |
          echo "✅ Job deployed successfully!"
          echo "Job Name: ${{ env.PACKAGE_NAME }}"
          echo "Region: ${{ env.REGION }}"
          echo "Image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{env.PACKAGE_NAME}}/${{ env.PACKAGE_NAME }}:${{ github.sha }}"